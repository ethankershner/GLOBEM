name: "dl_torch_combined"

# M5: Combined three-head model — classification + reorder + masked reconstruction.
# Loss: L = Lc + alpha * Lreorder + beta * Lrecon
# Answers RQ5: does combining both auxiliary tasks outperform either alone?

feature_definition:
  use_norm_features: False # Reorder feature set

data_loader:
  batch_size: 32
  generate_by: "across_dataset"
  mixup: "across"
  mixup_alpha: 0.2

model_params:
  arch: "Transformer"
  input_dim: 2
  d_model: 64
  num_heads: 8
  ff_dim: 128
  num_layers: 4
  dropout: 0.1
  num_reorder_class: 200
  rate_of_reorder: 0.7
  weight_of_reorder: 0.2
  beta: 0.2 # reconstruction loss weight
  max_masked_modalities: 2
  recon_hidden_dim: 64
  flag_y_vector: True

training_params:
  optimizer: "AdamW"
  scheduler: "cosine_warmup"
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 300
  epochs: 200
  steps_per_epoch: 100
  patience: 20
  grad_clip: 1.0
  best_epoch_strategy: "direct"
  verbose: 0
  skip_training: False
