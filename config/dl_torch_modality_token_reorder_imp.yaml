name: "dl_torch_modality_token_reorder_imp"

feature_definition:
  use_norm_features: False

data_loader:
  batch_size: 512
  generate_by: "across_dataset"
  mixup: "across"
  mixup_alpha: 0.2

model_params:
  input_dim: 2
  flag_y_vector: True
  # Per-modality CNN
  conv_channels: 8
  d_token: 32
  # Cross-modality attention
  num_cross_layers: 2
  num_heads: 4
  ff_dim: 64
  cross_dropout: 0.1
  # Reorder
  num_reorder_class: 200
  rate_of_reorder: 0.7
  weight_of_reorder: 0.2

imputation: "autoencoder"
imputation_params:
  bottleneck_dim: 20
  epochs: 10
  lr: 0.001

training_params:
  optimizer: "Adam"
  scheduler: "cosine_restarts"
  learning_rate: 0.001
  cos_annealing_step: 20
  cos_annealing_decay: 0.95
  cos_annealing_alpha: 0.01
  cos_annealing_t_mul: 2.0
  epochs: 200
  steps_per_epoch: 100
  patience: 20
  grad_clip: 0.0
  best_epoch_strategy: "direct"
  verbose: 0
  skip_training: False
