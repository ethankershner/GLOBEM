name: "dl_torch_mae_simultaneous"

# M4a: MAE-Transformer (simultaneous) — classification + masked reconstruction
# trained jointly. Loss: L = Lc + beta * Lmask. Answers RQ4 vs M3.

feature_definition:
  use_norm_features: False # Reorder feature set

data_loader:
  batch_size: 32
  generate_by: "across_dataset"
  mixup: "across"
  mixup_alpha: 0.2

model_params:
  arch: "Transformer"
  input_dim: 2
  d_model: 64
  num_heads: 8
  ff_dim: 128
  num_layers: 4
  dropout: 0.1
  beta: 0.2 # reconstruction loss weight
  max_masked_modalities: 2 # K ~ Uniform{1, max_masked}
  recon_hidden_dim: 64
  flag_y_vector: True

training_params:
  optimizer: "AdamW"
  scheduler: "cosine_warmup"
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 300
  epochs: 200
  steps_per_epoch: 100
  patience: 20
  grad_clip: 1.0
  mae_training_mode: "simultaneous"
  best_epoch_strategy: "direct"
  verbose: 0
  skip_training: False
