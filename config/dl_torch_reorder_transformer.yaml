name: "dl_torch_reorder_transformer"

# M3: Reorder-Transformer — same Reorder strategy as M0, transformer architecture.
# Primary comparison: M3 vs M0 answers the architecture question (RQ2).

feature_definition:
  use_norm_features: False # Reorder feature set

data_loader:
  batch_size: 32
  generate_by: "across_dataset"
  mixup: "across"
  mixup_alpha: 0.2

model_params:
  arch: "Transformer"
  input_dim: 2
  d_model: 64
  num_heads: 8
  ff_dim: 128
  num_layers: 4
  dropout: 0.1
  num_reorder_class: 200
  rate_of_reorder: 0.7
  weight_of_reorder: 0.2
  flag_y_vector: True

training_params:
  optimizer: "AdamW"
  scheduler: "cosine_warmup"
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 1000 # 5% of 200 epochs * 100 steps
  epochs: 200
  steps_per_epoch: 100
  patience: 10
  grad_clip: 1.0
  best_epoch_strategy: "direct"
  verbose: 0
  skip_training: False
